name: Automatic tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Get the proposed version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the program's packages
        id: install
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version | Out-File test-environment.txt
          python -m pip freeze | Out-File test-environment.txt -Append

      - name: Check the test positions and angle definitions
        run: python -m limbtrack.protocol check

      - name: Run all automatic tests
        id: tests
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=test-results.xml

      - name: Explain the result
        if: always()
        run: |
          "## Automatic test result" >> $env:GITHUB_STEP_SUMMARY
          "Package installation: ${{ steps.install.outcome }}." >> $env:GITHUB_STEP_SUMMARY
          "Tests: ${{ steps.tests.outcome }}." >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path test-results.xml) {
            [xml]$report = Get-Content test-results.xml -Raw
            $cases = @($report.SelectNodes("//testcase"))
            $failed = @($report.SelectNodes("//testcase[failure or error]")).Count
            $skipped = @($report.SelectNodes("//testcase[skipped]")).Count
            $passed = $cases.Count - $failed - $skipped
            "Passed: $passed. Failed or errored: $failed. Skipped: $skipped." >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          "These checks use generated pictures and simulated signals. They do not check the real camera, load cell or sound output." >> $env:GITHUB_STEP_SUMMARY
          "The test report and installed package versions are available under Artifacts on this run." >> $env:GITHUB_STEP_SUMMARY

      - name: Save the test report and package versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-python312-test-results
          path: |
            test-results.xml
            test-environment.txt
          if-no-files-found: ignore
          retention-days: 14
